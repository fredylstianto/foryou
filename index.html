<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Love Page</title>
    <meta name="language" content="zh-CN">
    <meta name="github" content="https://github.com/sun0225SUN/Awesome-Love-Code">
    <meta name="describe" content="收集不易，您的star是我坚持的动力，同时也欢迎各位PR哦! ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon"
        href="https://cdn.jsdelivr.net/gh/sun0225SUN/photos/img/20210715233345.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .namebox {
            color: #ff5ba5;
            position: absolute;
            z-index: 9999;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: 1s;
            text-align: center;
            opacity: 0;
        }

        .namebox h1 {
            margin: 0 auto;
            font-family: 'Comic Neue', 'Comic Sans MS', cursive, sans-serif;
            font-size: clamp(24px, 5vw, 36px);
        }

        #love-timer {
            font-family: 'Comic Neue', 'Comic Sans MS', cursive, sans-serif;
            margin-top: 10px;
            font-size: clamp(14px, 3.2vw, 18px);
        }

        .start-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.4s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .start-dialog {
            padding: 24px 28px;
            max-width: 320px;
            width: 80%;
            max-height: 80vh;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            overflow-y: auto;
        }

        .start-title {
            margin: 0 0 8px;
            font-size: clamp(18px, 5vw, 22px);
            color: #ff5ba5;
            font-family: 'Comic Neue', 'Comic Sans MS', cursive, sans-serif;
        }

        .start-subtitle {
            margin: 0 0 20px;
            font-size: clamp(13px, 3.5vw, 16px);
            color: #f5f5f5;
            line-height: 1.5;
            font-family: 'Comic Neue', 'Comic Sans MS', cursive, sans-serif;
        }

        .start-button {
            display: inline-block;
            padding: 10px 22px;
            font-size: clamp(14px, 4vw, 16px);
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: linear-gradient(135deg, #ff5ba5, #ff9f7b);
            color: #fff;
            box-shadow: 0 6px 15px rgba(255, 91, 165, 0.5);
        }
    </style>

</head>

<body>

    <canvas id="canvas-matrix"></canvas>
    <canvas class="canvas"></canvas>
    <canvas id="pinkboard"></canvas>

    <script src="js/matrix.js"></script>

    <div class="namebox">
        <h1 id="title-love">Dyy❤️Ryy</h1>
        <div id="love-timer">0 hari 0 jam 0 menit 0 detik</div>
    </div>

    <script>
        const startTime = new Date('2025-10-29T17:52:00+07:00');

        function updateLoveTimer() {
            const now = new Date();
            let diffSeconds = Math.floor((now - startTime) / 1000);
            if (diffSeconds < 0) diffSeconds = 0;

            const days = Math.floor(diffSeconds / 86400);
            diffSeconds %= 86400;
            const hours = Math.floor(diffSeconds / 3600);
            diffSeconds %= 3600;
            const minutes = Math.floor(diffSeconds / 60);
            const seconds = diffSeconds % 60;

            document.getElementById('love-timer').textContent =
                `${days} hari ${hours} jam ${minutes} menit ${seconds} detik`;
        }

        updateLoveTimer();
        setInterval(updateLoveTimer, 1000);
    </script>

    <div id="start-overlay" class="start-overlay">
        <div class="start-dialog">
            <h2 class="start-title">Welcome</h2>
            <p class="start-subtitle">Please tap start button.</p>
            <button id="start-button" class="start-button">Tap to Start</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="dunno.mp3" type="audio/mpeg">
    </audio>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const startOverlay = document.getElementById('start-overlay');
        const startButton = document.getElementById('start-button');
        const namebox = document.querySelector('.namebox');

        function loadScript(src) {
            return new Promise(resolve => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                document.body.appendChild(script);
            });
        }

        function revealLoveTitle() {
            namebox.style.opacity = 1;
        }

        window.addEventListener('hearts-ready', revealLoveTitle);

        async function startExperience() {
            startButton.disabled = true;
            try { await bgMusic.play(); } catch (e) { }

            await loadScript("js/index.js");
            await loadScript("js/heart.js");

            startOverlay.classList.add('hidden');
        }

        startButton.addEventListener('click', startExperience);
    </script>

</body>
</html>
