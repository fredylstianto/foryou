    <script>
        const bgMusic = document.getElementById('bg-music');
        const startOverlay = document.getElementById('start-overlay');
        const startButton = document.getElementById('start-button');
        const namebox = document.querySelector('.namebox');

        function loadScript(src) {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                document.body.appendChild(script);
            });
        }

        // ✨ HANYA dipanggil oleh event dari heart.js
        function revealLoveTitle() {
            if (namebox) {
                namebox.style.opacity = 1;
            }
        }

        // Dengarkan sinyal dari heart.js
        window.addEventListener('hearts-ready', revealLoveTitle);

        async function startExperience() {
            if (startButton) {
                startButton.disabled = true;
            }

            // 1️⃣ Mulai musik (dalam konteks interaksi user)
            if (bgMusic) {
                try {
                    await bgMusic.play();
                } catch (err) {
                    console.log("Audio gagal diputar:", err);
                }
            }

            // 2️⃣ Load animasi utama setelah user klik
            await loadScript("js/index.js");
            await loadScript("js/heart.js");
            // heart.js nanti yang memanggil event 'hearts-ready'

            // 3️⃣ Tutup popup (TAPI namebox belum muncul sampai hearts-ready)
            if (startOverlay) startOverlay.classList.add('hidden');
        }

        if (startButton) {
            startButton.addEventListener('click', startExperience);
        }

        // Support keyboard (desktop) - Enter / Space
        document.addEventListener('keydown', function (e) {
            if (!startOverlay || startOverlay.classList.contains('hidden')) return;

            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                startExperience();
            }
        });

        // Pastikan seluruh canvas selalu set ke ukuran layar actual
        function resizeCanvasToFullScreen() {
            const cvsList = document.querySelectorAll('canvas');
            cvsList.forEach(cvs => {
                cvs.width = window.innerWidth;
                cvs.height = window.innerHeight;
            });
        }

        window.addEventListener('load', resizeCanvasToFullScreen);
        window.addEventListener('resize', resizeCanvasToFullScreen);
    </script>
